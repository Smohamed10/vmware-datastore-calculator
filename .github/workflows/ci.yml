name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE: quay.io/YOUR_ORG/vcapacity

jobs:
  # ── Gate 1: audit, unit tests, build ─────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (lockfile-pinned)
        run: npm ci --no-audit --no-fund

      - name: Dependency vulnerability audit (production deps)
        run: npm audit --omit=dev --audit-level=high

      - name: Unit tests (calculation engine)
        run: npx vitest run

      - name: Build
        run: npm run build

  # ── Gate 2: image build, vulnerability scan, sign, push ──────
  image:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # cosign keyless signing
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ROBOT_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Filesystem + image vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Push to Quay (Clair rescans server-side)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha

      - name: Sign image (cosign keyless)
        uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes ${{ env.IMAGE }}:${{ github.sha }}

# Deployment is GitOps: ArgoCD watches openshift/ and applies the
# kustomization; promotion = pinning the scanned image digest there.
