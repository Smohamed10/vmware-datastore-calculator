# ─────────────────────────────────────────────────────────────
#  VCapacity nginx — rootless SPA serving, hardened headers
#  Listens on 8080 (non-root). All temp paths under /tmp so the
#  container runs with a read-only root filesystem + emptyDir.
# ─────────────────────────────────────────────────────────────
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;

  sendfile on;
  keepalive_timeout 65;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers (inherited by locations that don't
    #    re-declare add_header — hence caching uses `expires`) ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # App ships as a same-origin single-file bundle with self-hosted fonts;
    # 'unsafe-inline' is required for the inlined script/styles. No remote
    # origins are permitted for any resource type. See README § Security.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Liveness/readiness probe
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Static brand assets (logo, favicon, fonts) — long cache
    location ~* \.(?:png|svg|ico|woff2?)$ {
      expires 30d;
      try_files $uri =404;
    }

    # SPA fallback — HTML is never cached so deployments propagate instantly
    location / {
      expires -1;
      try_files $uri $uri/ /index.html;
    }
  }
}
